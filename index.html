<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinanceRAJ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #4f46e5; --bg-body: #f8fafc; --surface: #ffffff; --text-main: #0f172a; --text-sec: #64748b; --border: #e2e8f0; --radius: 16px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .login-card { background: var(--surface); padding: 40px; border-radius: var(--radius); box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; }
        .logo { width: 60px; height: auto; margin-bottom: 16px; }
        h1 { color: var(--primary); font-size: 28px; font-weight: 800; margin-bottom: 8px; }
        .subtitle { color: var(--text-sec); font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 13px; color: var(--text-main); }
        
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-sec); font-size: 16px; }
        
        input { width: 100%; padding: 14px 16px 14px 44px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; transition: 0.2s; background: var(--bg-body); }
        input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        /* Animasi muncul password */
        #passwordGroup { display: none; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        button { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .error-msg { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; font-weight: 500; }
        .footer { margin-top: 30px; font-size: 12px; color: var(--text-sec); border-top: 1px solid var(--border); padding-top: 20px; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="assets/logo.png" alt="Logo RAJ" class="logo" onerror="this.style.display='none'">
        <h1>FinanceRAJ</h1>
        <p class="subtitle">Sistem Akuntansi & Keuangan Profesional<br>CV REZEKI AMANAH JAYA GROUP</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" required placeholder="Masukkan email Anda" autocomplete="off">
                </div>
            </div>

            <!-- Kolom Password (Muncul Otomatis) -->
            <div class="form-group" id="passwordGroup">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Masukkan password">
                </div>
            </div>
            
            <button type="submit" id="btnLogin">
                <i class="fas fa-sign-in-alt"></i> Masuk
            </button>
            
            <div class="error-msg" id="errorMsg"></div>
        </form>

        <div class="footer">
            © 2026 CV Rezeki Amanah Jaya Group | Tangerang
        </div>
    </div>

    <!-- Firebase SDK (Hanya untuk Admin) -->
    <script type="module">
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        const firebaseConfig = { apiKey: "AIzaSyAc12QQPnjqlaNmIzPl2OqfTrC0HP2YCWg", authDomain: "finance-raj.firebaseapp.com", projectId: "finance-raj", storageBucket: "finance-raj.firebasestorage.app", messagingSenderId: "138468278392", appId: "1:138468278392:web:215731466beb7f89566d8d", measurementId: "G-BMG4L7P2DP" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxSf-y1s_ewWXblCpu4N0NHFdSM7Y0usDaJiEdSJE-5Jv35oVGAkgAsSAifJL6VTJimXQ/exec';

        const emailInput = document.getElementById('email');
        const passwordGroup = document.getElementById('passwordGroup');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('errorMsg');
        const btnLogin = document.getElementById('btnLogin');

        // DETEKSI EMAIL SAAT MENGETIK
        let checkTimeout;
        emailInput.addEventListener('input', (e) => {
            clearTimeout(checkTimeout);
            const email = e.target.value.trim();
            errorMsg.style.display = 'none';
            
            // Jika email kosong, sembunyikan password
            if(!email) {
                passwordGroup.style.display = 'none';
                passwordInput.required = false;
                return;
            }

            // Delay 500ms agar tidak spam request ke server
            checkTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`${GAS_URL}?action=checkUserEmail&email=${encodeURIComponent(email)}`);
                    const data = await res.json();
                    
                    if(data.isSpreadsheetUser) {
                        // User ditemukan di Spreadsheet -> Tampilkan Password
                        passwordGroup.style.display = 'block';
                        passwordInput.required = true;
                        passwordInput.focus();
                    } else {
                        // User tidak ada di Spreadsheet (Mungkin Firebase Admin) -> Sembunyikan Password
                        passwordGroup.style.display = 'none';
                        passwordInput.required = false;
                    }
                } catch(err) { console.error("Gagal cek user:", err); }
            }, 500);
        });

        // HANDLE SUBMIT LOGIN
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const isSpreadsheetLogin = passwordGroup.style.display === 'block';

            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
            errorMsg.style.display = 'none';

            try {
                if (isSpreadsheetLogin) {
                    // --- LOGIN VIA SPREADSHEET (Staff/Karyawan) ---
                    const res = await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'loginWithCredentials', email, password })
                    });
                    const result = await res.json();

                    if (result.status === 'success') {
                        localStorage.setItem('financeRajUser', JSON.stringify(result));
                        window.location.href = 'absensi.html';
                    } else {
                        throw new Error(result.message);
                    }

                } else {
                    // --- LOGIN VIA FIREBASE (Admin) ---
                    // Kita perlu verifikasi role admin dulu sebelum login Firebase
                    const checkRes = await fetch(`${GAS_URL}?action=loginWithEmail&email=${encodeURIComponent(email)}`);
                    const checkData = await checkRes.json();

                    if(checkData.status !== 'success') {
                        throw new Error(checkData.message || 'Email Admin tidak terdaftar');
                    }

                    // Jika email valid, lanjut login Firebase
                    // Note: Di sistem hybrid ini, password Firebase harus tetap dimasukkan user 
                    // atau kita bisa bypass jika ingin fully automatic (tapi kurang aman).
                    // Untuk saat ini, kita asumsikan Admin tahu password Firebase mereka.
                    // Tapi karena form password disembunyikan, kita perlu prompt manual atau 
                    // Admin harus ingat password Firebase-nya.
                    
                    // SOLUSI: Tampilkan prompt password khusus Firebase jika belum ada
                    const fbPassword = prompt("Masukkan Password Firebase Admin Anda:");
                    if(!fbPassword) throw new Error("Login dibatalkan");

                    await signInWithEmailAndPassword(auth, email, fbPassword);
                    
                    localStorage.setItem('financeRajUser', JSON.stringify({
                        email: email,
                        fullName: checkData.fullName,
                        role: checkData.role
                    }));
                    
                    window.location.href = 'dashboard.html';
                }

            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
                btnLogin.disabled = false;
                btnLogin.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';
            }
        });
    </script>
</body>
</html>
