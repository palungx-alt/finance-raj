<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinanceRAJ - Input Jurnal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS SAMA SEPERTI SEBELUMNYA, TIDAK PERLU DIUBAH */
        :root { --primary: #4f46e5; --primary-glow: rgba(79, 70, 229, 0.15); --bg-body: #f8fafc; --surface: #ffffff; --text-main: #0f172a; --text-sec: #64748b; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --radius: 16px; --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }
        .top-bar { background: var(--surface); padding: 16px 24px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; }
        .brand-area { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 32px; height: auto; }
        .page-title h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; margin: 0; }
        .page-title p { font-size: 12px; color: var(--text-sec); margin-top: 2px; }
        .btn-back { background: var(--bg-body); border: none; padding: 10px; border-radius: 12px; cursor: pointer; color: var(--text-main); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-back:hover { background: var(--border); }
        .container { max-width: 800px; margin: 24px auto; padding: 0 20px; }
        .form-card { background: var(--surface); padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 24px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 13px; color: var(--text-main); }
        .form-control { width: 100%; padding: 14px 16px; background: var(--bg-body); border: 1px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; transition: 0.2s; color: var(--text-main); }
        .form-control:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px var(--primary-glow); }
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .entries-container { background: var(--bg-body); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 16px; }
        .entry-header { display: grid; grid-template-columns: 1fr 100px 100px 80px; gap: 8px; padding: 12px 16px; background: #f1f5f9; border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 700; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.5px; }
        .entry-row { display: grid; grid-template-columns: 1fr 100px 100px 80px; gap: 8px; padding: 12px 16px; background: white; border-bottom: 1px solid var(--border); align-items: center; }
        .entry-row:last-child { border-bottom: none; }
        .entry-row select, .entry-row input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: white; }
        .entry-row select:focus, .entry-row input:focus { border-color: var(--primary); outline: none; }
        .action-buttons { display: flex; gap: 6px; justify-content: center; }
        .btn-action { width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 12px; }
        .btn-edit { background: #fef3c7; color: var(--warning); }
        .btn-edit:hover { background: var(--warning); color: white; }
        .btn-delete { background: #fee2e2; color: var(--danger); }
        .btn-delete:hover { background: var(--danger); color: white; }
        .free-text-container { display: none; margin-top: 8px; padding: 12px; background: #f8fafc; border-radius: 8px; border: 1px dashed var(--border); }
        .free-text-row { display: grid; grid-template-columns: 100px 1fr; gap: 8px; margin-bottom: 8px; align-items: center; }
        .free-label { font-size: 11px; font-weight: 600; color: var(--text-sec); }
        .checkbox-wrapper { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
        .checkbox-wrapper input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
        .checkbox-wrapper label { font-size: 12px; color: var(--text-sec); cursor: pointer; user-select: none; }
        .btn-add-row { background: white; border: 2px dashed var(--border); color: var(--primary); width: 100%; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-add-row:hover { border-color: var(--primary); background: var(--primary-glow); }
        .balance-card { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%); border-radius: var(--radius); margin-bottom: 24px; border: 1px solid #dbeafe; }
        .status-badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-balanced { background: #d1fae5; color: #065f46; }
        .status-unbalanced { background: #fee2e2; color: #991b1b; }
        .btn-submit { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; background: var(--text-sec); }
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .form-group { margin-bottom: 16px; }
            .entry-header { display: none; }
            .entry-row { grid-template-columns: 1fr; gap: 10px; padding: 16px; border-bottom: 2px solid var(--bg-body); }
            .entry-row > div { width: 100%; }
            .mobile-label { font-size: 11px; color: var(--text-sec); margin-bottom: 4px; display: block; font-weight: 600; }
            .action-buttons { justify-content: flex-start; margin-top: 8px; }
            .btn-action { width: 100%; height: 40px; }
            .container { padding: 0 16px; margin-top: 16px; }
            .form-card { padding: 20px 16px; border-radius: 12px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="brand-area">
            <img src="assets/logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
            <div class="page-title">
                <h1>Input Jurnal</h1>
                <p>Catat transaksi operasional harian</p>
            </div>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="btn-back"><i class="fas fa-arrow-left"></i></button>
    </div>

    <div class="container">
        <div class="form-card">
            <div class="form-row">
                <div class="form-group">
                    <label>Tanggal Transaksi</label>
                    <input type="date" id="transDate" class="form-control">
                </div>
                <div class="form-group">
                    <label>Jenis & No. Bukti</label>
                    <div style="display:flex; gap:8px;">
                        <select id="proofType" class="form-control" style="width:120px;" onchange="generateNextNoBukti()">
                            <option value="BKK">BKK (Keluar)</option>
                            <option value="BKM">BKM (Masuk)</option>
                        </select>
                        <input type="text" id="refNumber" class="form-control" placeholder="Auto-generated" readonly style="background:#f1f5f9; cursor:not-allowed; flex:1;">
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label>Keterangan Transaksi</label>
                <input type="text" id="description" class="form-control" placeholder="Cth: Pembelian solar truk B 1234 CD">
            </div>
        </div>

        <div class="section-title"><i class="fas fa-list-ul" style="color:var(--primary)"></i> Detail Akun (Debit & Kredit)</div>
        
        <div class="entries-container">
            <div class="entry-header">
                <div>Akun (COA)</div>
                <div style="text-align:center;">Debit (Rp)</div>
                <div style="text-align:center;">Kredit (Rp)</div>
                <div style="text-align:center;">Aksi</div>
            </div>
            
            <div id="journalEntries">
                <!-- Baris jurnal akan ditambahkan via JS -->
            </div>
        </div>
        
        <button class="btn-add-row" onclick="window.addEntryRow()"><i class="fas fa-plus-circle"></i> Tambah Baris Akun</button>

        <div class="balance-card">
            <div>
                <div style="font-weight:700; color:var(--primary); font-size:15px;">Status Balance</div>
                <div style="font-size:12px; color:var(--text-sec); margin-top:4px;">Total Debit harus = Total Kredit</div>
            </div>
            <div style="text-align:right;">
                <div id="balanceStatus" class="status-badge status-unbalanced">TIDAK SEIMBANG</div>
                <div style="margin-top:8px; font-size:13px; color:var(--text-sec);">Selisih: <span id="diffAmount" style="font-weight:700; color:var(--text-main);">Rp 0</span></div>
            </div>
        </div>

        <button id="btnSave" class="btn-submit" disabled onclick="window.saveJournal()">
            <i class="fas fa-paper-plane"></i> Simpan Jurnal
        </button>
    </div>

    <script type="module">
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        const firebaseConfig = { apiKey: "AIzaSyAc12QQPnjqlaNmIzPl2OqfTrC0HP2YCWg", authDomain: "finance-raj.firebaseapp.com", projectId: "finance-raj", storageBucket: "finance-raj.firebasestorage.app", messagingSenderId: "138468278392", appId: "1:138468278392:web:215731466beb7f89566d8d", measurementId: "G-BMG4L7P2DP" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxSf-y1s_ewWXblCpu4N0NHFdSM7Y0usDaJiEdSJE-5Jv35oVGAkgAsSAifJL6VTJimXQ/exec';

        let coaData = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const user = JSON.parse(localStorage.getItem('financeRajUser'));
            if (!user) window.location.href = 'index.html';
            
            document.getElementById('transDate').valueAsDate = new Date();
            
            // Load COA & Generate No Bukti
            await refreshCOA();
            await generateNextNoBukti();
            
            window.addEntryRow();
            window.addEntryRow();
        });

        // FUNGSI REFRESH COA DENGAN FILTER DATA SAMPAH
        async function refreshCOA() {
            try {
                const res = await fetch(`${GAS_URL}?action=getCOA`);
                const data = await res.json();
                if(data.status === 'success') {
                    // Filter hanya data yang kode akunnya valid (format X-XXXX)
                    coaData = data.accounts.filter(acc => /^\d+-\d+$/.test(String(acc.code)));
                }
            } catch(e) { console.error("Gagal load COA:", e); }
        }

        // FUNGSI GENERATE NO BUKTI FORMAT BARU (BKM/BKK/MM/YYYY/XXX)
        async function generateNextNoBukti() {
            try {
                const proofType = document.getElementById('proofType').value; // BKM atau BKK
                const res = await fetch(`${GAS_URL}?action=getNextProofNumber&type=${proofType}`);
                const data = await res.json();
                
                if(data.status === 'success') {
                    const nextNum = String(data.nextNum).padStart(3, '0');
                    const now = new Date();
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const year = now.getFullYear();
                    
                    // Format: BKM/MM/YYYY/001
                    document.getElementById('refNumber').value = `${proofType}/${month}/${year}/${nextNum}`;
                }
            } catch (e) {
                console.error("Gagal generate no bukti:", e);
                const proofType = document.getElementById('proofType').value;
                const now = new Date();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const year = now.getFullYear();
                document.getElementById('refNumber').value = `${proofType}/${month}/${year}/001`;
            }
        }

        window.formatInputRupiah = function(angka) {
            if (!angka) return '';
            let number_string = angka.toString().replace(/[^,\d]/g, '').toString();
            let split = number_string.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);
            if (ribuan) { let separator = sisa ? '.' : ''; rupiah += separator + ribuan.join('.'); }
            rupiah = split[1] != undefined ? rupiah + ',' + split[1] : rupiah;
            return rupiah;
        }

        window.unformatRupiah = function(rupiah) {
            if (!rupiah) return 0;
            return parseFloat(rupiah.toString().replace(/\./g, '').replace(/,/g, '.')) || 0;
        }

        window.addEntryRow = function() {
            const container = document.getElementById('journalEntries');
            const row = document.createElement('div');
            row.className = 'entry-row';
            
            let options = '<option value="">-- Pilih Akun --</option>';
            coaData.forEach(acc => options += `<option value="${acc.code}">${acc.code} - ${acc.name}</option>`);
            options += `<option value="FREE_TEXT">-- LAINNYA (Ketik Manual) --</option>`;

            const isMobile = window.innerWidth <= 600;
            const lblAkun = isMobile ? '<span class="mobile-label">Akun</span>' : '';
            const lblDebit = isMobile ? '<span class="mobile-label">Debit (Rp)</span>' : '';
            const lblKredit = isMobile ? '<span class="mobile-label">Kredit (Rp)</span>' : '';

            row.innerHTML = `
                <div>
                    ${lblAkun}
                    <select class="coa-select" onchange="window.handleAccountChange(this)">${options}</select>
                    <div class="free-text-container">
                        <div class="free-text-row">
                            <div class="free-label">Kode Akun:</div>
                            <input type="text" class="free-code-input form-control" placeholder="Cth: 5-1700" style="padding:8px; font-size:13px;">
                        </div>
                        <div class="free-text-row">
                            <div class="free-label">Nama Akun:</div>
                            <input type="text" class="free-name-input form-control" placeholder="Cth: Beban Bunga Bank" style="padding:8px; font-size:13px;">
                        </div>
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="addToCOACheck_${Date.now()}">
                            <label for="addToCOACheck_${Date.now()}">Simpan permanen ke daftar COA</label>
                        </div>
                    </div>
                </div>
                <div>${lblDebit}<input type="text" class="debit-input" placeholder="0" oninput="this.value=window.formatInputRupiah(this.value); window.updateBalance()" onfocus="this.select()" inputmode="numeric"></div>
                <div>${lblKredit}<input type="text" class="credit-input" placeholder="0" oninput="this.value=window.formatInputRupiah(this.value); window.updateBalance()" onfocus="this.select()" inputmode="numeric"></div>
                <div>
                    <div class="action-buttons">
                        <button class="btn-action btn-edit" title="Edit Baris" onclick="window.editRow(this)"><i class="fas fa-pen"></i></button>
                        <button class="btn-action btn-delete" title="Hapus Baris" onclick="this.closest('.entry-row').remove(); window.updateBalance();"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `;
            container.appendChild(row);
        }

        window.editRow = function(btn) {
            const row = btn.closest('.entry-row');
            const select = row.querySelector('.coa-select');
            
            if(btn.classList.contains('btn-save')) {
                btn.classList.remove('btn-save');
                btn.classList.add('btn-edit');
                btn.innerHTML = '<i class="fas fa-pen"></i>';
                select.disabled = false;
                row.querySelectorAll('input').forEach(inp => inp.disabled = false);
                row.querySelector('.btn-delete').disabled = false;
                return;
            }

            btn.classList.remove('btn-edit');
            btn.classList.add('btn-save');
            btn.innerHTML = '<i class="fas fa-check"></i>';
            select.disabled = false;
            row.querySelectorAll('input').forEach(inp => inp.disabled = false);
            row.querySelector('.btn-delete').disabled = false;
        }

        window.handleAccountChange = function(selectEl) {
            const freeContainer = selectEl.nextElementSibling;
            if (selectEl.value === 'FREE_TEXT') { 
                freeContainer.style.display = 'block'; 
                freeContainer.querySelector('.free-code-input').focus();
            } else { 
                freeContainer.style.display = 'none'; 
            }
            window.updateBalance();
        }

        window.updateBalance = function() {
            let totalDebit = 0, totalCredit = 0;
            document.querySelectorAll('.debit-input').forEach(i => totalDebit += window.unformatRupiah(i.value));
            document.querySelectorAll('.credit-input').forEach(i => totalCredit += window.unformatRupiah(i.value));
            
            const diff = Math.abs(totalDebit - totalCredit);
            const isBalanced = diff < 0.01 && totalDebit > 0;
            
            const statusEl = document.getElementById('balanceStatus');
            const diffEl = document.getElementById('diffAmount');
            const btn = document.getElementById('btnSave');
            
            if (isBalanced) {
                statusEl.textContent = "SEIMBANG"; statusEl.className = "status-badge status-balanced";
                diffEl.textContent = "Rp 0"; btn.disabled = false;
            } else {
                statusEl.textContent = "TIDAK SEIMBANG"; statusEl.className = "status-badge status-unbalanced";
                diffEl.textContent = formatRupiah(diff); btn.disabled = true;
            }
        }

        window.saveJournal = async function() {
            const btn = document.getElementById('btnSave');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

            const items = [];
            let isValid = true;

            document.querySelectorAll('.entry-row').forEach(row => {
                const select = row.querySelector('.coa-select');
                const freeContainer = row.querySelector('.free-text-container');
                let code, name, addToCOA = false;

                if (select.value === 'FREE_TEXT') {
                    code = row.querySelector('.free-code-input').value.trim();
                    name = row.querySelector('.free-name-input').value.trim();
                    addToCOA = row.querySelector('input[type="checkbox"]').checked; 
                    
                    if (!code || !name || !/^\d+-\d+$/.test(code)) {
                        isValid = false;
                        row.querySelector('.free-code-input').style.borderColor = 'red';
                    }
                } else {
                    code = select.value;
                    name = select.options[select.selectedIndex].text;
                }
                
                const debit = window.unformatRupiah(row.querySelector('.debit-input').value);
                const credit = window.unformatRupiah(row.querySelector('.credit-input').value);

                if ((debit > 0 || credit > 0) && code) {
                    items.push({ code, name, debit, credit, type: debit > 0 ? 'debit' : 'kredit', amount: debit > 0 ? debit : credit, addToCOA });
                }
            });

            if (!isValid) {
                alert("⚠️ Mohon lengkapi Kode Akun (format: X-XXXX) dan Nama Akun untuk baris 'LAINNYA'.");
                btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Simpan Jurnal';
                return;
            }

            const user = JSON.parse(localStorage.getItem('financeRajUser'));
            const journalData = {
                tanggal: document.getElementById('transDate').value,
                noBukti: document.getElementById('refNumber').value,
                keterangan: document.getElementById('description').value,
                inputBy: user.email, inputByName: user.fullName, items: items, createdAt: new Date().toISOString()
            };

            try {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'addJurnalFromWeb', data: journalData }) });
                await refreshCOA(); // Refresh COA setelah simpan
                alert("✅ Jurnal berhasil disimpan!");
                window.location.href = 'dashboard.html';
            } catch(e) {
                console.error(e);
                alert('Gagal menyimpan: ' + e.message);
                btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Simpan Jurnal';
            }
        }

        function formatRupiah(num) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num); }
    </script>
</body>
</html>
