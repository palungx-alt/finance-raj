<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinanceRAJ - Input Jurnal & Import Excel v3.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Library SheetJS untuk membaca Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <style>
        :root { --primary: #4f46e5; --bg-body: #f8fafc; --surface: #ffffff; --text-main: #0f172a; --text-sec: #64748b; --border: #e2e8f0; --radius: 16px; --success: #10b981; --danger: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }
        
        .top-bar { background: var(--surface); padding: 16px 20px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .brand-area { display: flex; align-items: center; gap: 12px; }
        .btn-back { background: var(--bg-body); border: none; padding: 10px; border-radius: 12px; cursor: pointer; color: var(--text-main); display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; transition: 0.2s; }
        .btn-back:hover { background: var(--border); }
        .page-title h1 { font-size: 18px; font-weight: 700; margin: 0; }
        .page-title p { font-size: 12px; color: var(--text-sec); margin-top: 2px; }
        
        .container { max-width: 900px; margin: 24px auto; padding: 0 16px; }
        
        /* FORM STYLES */
        .form-card { background: var(--surface); padding: 24px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); margin-bottom: 24px; }
        
        .form-group { margin-bottom: 16px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; background: var(--bg-body); transition: 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        /* UPLOAD AREA FOR EXCEL */
        .upload-area { 
            border: 2px dashed var(--border); border-radius: 12px; padding: 24px; text-align: center; 
            cursor: pointer; transition: 0.2s; margin-bottom: 20px; background: #fafafa;
        }
        .upload-area:hover, .upload-area.dragover { border-color: var(--primary); background: #eff6ff; }
        .upload-area i { font-size: 32px; color: var(--primary); margin-bottom: 8px; }
        .upload-area p { font-size: 14px; color: var(--text-sec); margin-bottom: 4px; }
        .upload-area span { font-size: 12px; color: var(--text-sec); opacity: 0.7; }
        #excelInput { display: none; }
        
        /* ITEM TABLE */
        .item-table-wrap { overflow-x: auto; margin: 20px 0; border: 1px solid var(--border); border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: #f8fafc; padding: 12px 14px; font-size: 11px; text-transform: uppercase; color: var(--text-sec); text-align: left; border-bottom: 1px solid var(--border); }
        td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        td input, td select { padding: 8px 10px; font-size: 13px; border-radius: 8px; margin: 0; }
        
        .btn-add-item { background: var(--bg-body); border: 1px dashed var(--border); color: var(--primary); padding: 10px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; margin-top: 8px; }
        .btn-add-item:hover { background: #eff6ff; border-color: var(--primary); }
        .btn-remove { background: #fef2f2; border: none; color: var(--danger); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-remove:hover { background: #fee2e2; }
        
        /* TOTAL & ACTION */
        .total-section { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-top: 2px solid var(--border); margin-top: 16px; }
        .total-label { font-size: 14px; color: var(--text-sec); font-weight: 600; }
        .total-value { font-size: 24px; font-weight: 800; color: var(--primary); }
        .balance-status { font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; }
        .balance-ok { background: #d1fae5; color: #065f46; }
        .balance-error { background: #fee2e2; color: #991b1b; }
        
        .btn-submit { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        /* NOTIFICATION */
        .notification { position: fixed; bottom: 24px; right: 24px; padding: 16px 20px; border-radius: 12px; color: white; font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); transform: translateY(100px); opacity: 0; transition: 0.3s ease; z-index: 1000; display: flex; align-items: center; gap: 10px; max-width: 400px; }
        .notification.show { transform: translateY(0); opacity: 1; }
        .notification.success { background: var(--success); }
        .notification.error { background: var(--danger); }
        
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .total-value { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="brand-area">
            <button onclick="window.location.href='dashboard.html'" class="btn-back"><i class="fas fa-arrow-left"></i></button>
            <div class="page-title">
                <h1>Input Jurnal & Import Excel v3.0</h1>
                <p>CV Rezeki Amanah Jaya Group</p>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- SECTION IMPORT EXCEL -->
        <div class="form-card">
            <div class="upload-area" id="excelUploadArea" onclick="document.getElementById('excelInput').click()">
                <i class="fas fa-file-excel"></i>
                <p>Klik atau Drag & Drop File Excel (.xlsx)</p>
                <span>Sistem akan otomatis membaca Tanggal, Akun, Debit, dan Kredit</span>
                <input type="file" id="excelInput" accept=".xlsx, .xls" onchange="handleExcelImport(this)">
            </div>
        </div>

        <!-- SECTION INPUT MANUAL -->
        <div class="form-card">
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-calendar"></i> Tanggal Transaksi</label>
                    <input type="text" id="purDate" placeholder="Contoh: 24/10/2026 atau 2026-10-24" onblur="validateAndFixDate(this)">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-hashtag"></i> No. Bukti</label>
                    <input type="text" id="noBukti" placeholder="Contoh: BKK/10/2026/055">
                </div>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-sticky-note"></i> Keterangan</label>
                <textarea id="keterangan" rows="2" placeholder="Deskripsi transaksi..."></textarea>
            </div>

            <label style="margin-top: 12px;"><i class="fas fa-list-ol"></i> Detail Akun & Nominal</label>
            <div class="item-table-wrap">
                <table id="jurnalTable">
                    <thead>
                        <tr>
                            <th style="width: 35%">Kode / Nama Akun</th>
                            <th style="width: 20%">Debit (Rp)</th>
                            <th style="width: 20%">Kredit (Rp)</th>
                            <th style="width: 15%">Tipe</th>
                            <th style="width: 10%"></th>
                        </tr>
                    </thead>
                    <tbody id="jurnalBody"></tbody>
                </table>
            </div>
            <button type="button" class="btn-add-item" onclick="addJournalRow()"><i class="fas fa-plus"></i> Tambah Baris Akun</button>

            <div class="total-section">
                <div>
                    <span class="total-label">Selisih Balance:</span>
                    <span id="balanceStatus" class="balance-status balance-error">Belum Seimbang</span>
                </div>
                <span class="total-value" id="diffDisplay">Rp 0</span>
            </div>

            <button type="button" class="btn-submit" id="btnSubmit" onclick="submitJournal()" disabled>
                <i class="fas fa-save"></i> Simpan Jurnal
            </button>
        </div>
    </div>

    <!-- NOTIFICATION TOAST -->
    <div id="notification" class="notification"></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxSf-y1s_ewWXblCpu4N0NHFdSM7Y0usDaJiEdSJE-5Jv35oVGAkgAsSAifJL6VTJimXQ/exec';
        let coaData = [];

        // ==========================================
        // INITIALIZATION
        // ==========================================
        window.onload = async function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('purDate').value = today;
            
            try {
                const res = await fetch(`${GAS_URL}?action=getCOA`);
                const data = await res.json();
                if(data.status === 'success') {
                    coaData = data.accounts;
                    addJournalRow(); 
                } else {
                    showNotification("Gagal memuat Chart of Accounts", "error");
                }
            } catch(e) {
                console.error(e);
                showNotification("Error koneksi ke server", "error");
            }
        };

        // ==========================================
        // SMART DATE PARSER (SAMA DENGAN BACKEND v21.8)
        // ==========================================
        function normalizeDate(val) {
            if (!val) return '';
            let strVal = String(val).trim();
            
            // Handle Angka Serial Excel (misal: 46294)
            if (/^\d{5}$/.test(strVal) && Number(strVal) > 40000 && Number(strVal) < 60000) {
                try {
                    const excelEpoch = new Date(1899, 11, 30); 
                    const dateObj = new Date(excelEpoch.getTime() + (Number(strVal) * 86400000));
                    const y = dateObj.getFullYear();
                    const m = String(dateObj.getMonth() + 1).padStart(2, '0');
                    const d = String(dateObj.getDate()).padStart(2, '0');
                    return `${y}-${m}-${d}`;
                } catch(e) {}
            }

            if (/^\d{4}-\d{2}-\d{2}$/.test(strVal)) return strVal;
            
            strVal = strVal.replace(/['"]/g, '').replace(/\s+/g, ' ').trim();
            
            let matchDMY = strVal.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
            if (matchDMY) return `${matchDMY[3]}-${matchDMY[2].padStart(2,'0')}-${matchDMY[1].padStart(2,'0')}`;
            
            let matchYMD = strVal.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
            if (matchYMD) return `${matchYMD[1]}-${matchYMD[2].padStart(2,'0')}-${matchYMD[3].padStart(2,'0')}`;
            
            try {
                const d = new Date(strVal);
                if (!isNaN(d.getTime())) {
                    const y = d.getFullYear();
                    const m = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    return `${y}-${m}-${day}`;
                }
            } catch(e) {}
            
            return strVal.substring(0, 10);
        }

        function validateAndFixDate(input) {
            const originalVal = input.value;
            const fixedVal = normalizeDate(originalVal);
            if (originalVal !== fixedVal && fixedVal !== '') {
                input.value = fixedVal;
                showNotification(`Tanggal diperbaiki menjadi: ${fixedVal}`, "success");
            }
        }

        // ==========================================
        // EXCEL IMPORT LOGIC
        // ==========================================
        function handleExcelImport(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // Konversi sheet ke JSON array of arrays
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                    
                    if(jsonData.length < 2) {
                        showNotification("File Excel kosong atau tidak memiliki data", "error");
                        return;
                    }

                    // Asumsi Header Excel: [Tanggal, No_Bukti, Keterangan, Email, Nama, Kode_Akun, Nama_Akun, Debit, Kredit]
                    // Kita mulai loop dari index 1 (melewati header)
                    let importedCount = 0;
                    
                    for(let i = 1; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        if(!row || row.length === 0) continue;

                        // Mapping kolom Excel ke form
                        const rawDate = row[0]; 
                        const noBukti = row[1] || '';
                        const keterangan = row[2] || '';
                        const kodeAkun = String(row[5] || '').trim();
                        const namaAkun = String(row[6] || '').trim();
                        let debit = parseFloat(row[7]) || 0;
                        let kredit = parseFloat(row[8]) || 0;

                        // Normalisasi Tanggal
                        const fixedDate = normalizeDate(rawDate);

                        // Isi Form Utama hanya sekali di baris pertama import
                        if (i === 1) {
                            document.getElementById('purDate').value = fixedDate;
                            document.getElementById('noBukti').value = noBukti;
                            document.getElementById('keterangan').value = keterangan;
                        }

                        // Cari COA code jika yang terbaca hanya nama
                        let finalCode = kodeAkun;
                        if (!/^\d/.test(finalCode) && namaAkun) {
                            const found = coaData.find(c => c.name.toLowerCase() === namaAkun.toLowerCase());
                            if(found) finalCode = found.code;
                        }

                        // Tambahkan baris ke tabel jurnal
                        addJournalRow(finalCode, namaAkun, debit, kredit);
                        importedCount++;
                    }

                    calcBalance();
                    showNotification(`Berhasil mengimpor ${importedCount} baris transaksi!`, "success");

                } catch(err) {
                    console.error(err);
                    showNotification("Gagal membaca file Excel: " + err.message, "error");
                }
            };
            reader.readAsArrayBuffer(file);
            input.value = ''; // Reset input agar bisa upload file sama lagi
        }

        // ==========================================
        // JOURNAL ROW MANAGEMENT
        // ==========================================
        function addJournalRow(code='', name='', debit='', credit='') {
            const tbody = document.getElementById('jurnalBody');
            const row = document.createElement('tr');
            
            let coaOptions = '<option value="">Pilih Akun...</option>';
            coaData.forEach(acc => {
                const selected = (acc.code === code) ? 'selected' : '';
                coaOptions += `<option value="${acc.code}" data-name="${acc.name}" ${selected}>${acc.code} - ${acc.name}</option>`;
            });

            // Format angka untuk tampilan input
            const displayDebit = debit ? new Intl.NumberFormat('id-ID').format(debit) : '';
            const displayCredit = credit ? new Intl.NumberFormat('id-ID').format(credit) : '';

            row.innerHTML = `
                <td>
                    <select class="account-select" onchange="updateAccountName(this)" required>${coaOptions}</select>
                    <input type="hidden" class="account-name" value="${name}">
                </td>
                <td><input type="text" class="amount-debit" value="${displayDebit}" placeholder="0" oninput="formatRupiahInput(this); calcBalance()"></td>
                <td><input type="text" class="amount-credit" value="${displayCredit}" placeholder="0" oninput="formatRupiahInput(this); calcBalance()"></td>
                <td>
                    <select class="trans-type">
                        <option value="debit" ${debit > 0 ? 'selected' : ''}>Debit</option>
                        <option value="kredit" ${credit > 0 ? 'selected' : ''}>Kredit</option>
                    </select>
                </td>
                <td><button type="button" class="btn-remove" onclick="removeRow(this)"><i class="fas fa-trash"></i></button></td>
            `;
            tbody.appendChild(row);
            
            if(debit || credit) calcBalance();
        }

        function removeRow(btn) {
            btn.closest('tr').remove();
            calcBalance();
        }

        function updateAccountName(select) {
            const option = select.options[select.selectedIndex];
            const nameInput = select.parentElement.querySelector('.account-name');
            if(option.value) {
                nameInput.value = option.getAttribute('data-name');
            } else {
                nameInput.value = '';
            }
        }

        // ==========================================
        // RUPIAH FORMATTING & BALANCE CHECK
        // ==========================================
        function formatRupiahInput(input) {
            let val = input.value.replace(/[^\d]/g, '');
            if (val === '') {
                input.value = '';
                return;
            }
            input.value = new Intl.NumberFormat('id-ID').format(val);
        }

        function parseRupiah(str) {
            if (!str) return 0;
            return Number(String(str).replace(/\./g, '').replace(',', '.')) || 0;
        }

        function calcBalance() {
            let totalDebit = 0;
            let totalCredit = 0;
            
            document.querySelectorAll('#jurnalBody tr').forEach(row => {
                totalDebit += parseRupiah(row.querySelector('.amount-debit').value);
                totalCredit += parseRupiah(row.querySelector('.amount-credit').value);
            });

            const diff = Math.abs(totalDebit - totalCredit);
            const statusEl = document.getElementById('balanceStatus');
            const diffEl = document.getElementById('diffDisplay');
            const btnSubmit = document.getElementById('btnSubmit');

            diffEl.textContent = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(diff);

            if (diff < 0.01 && (totalDebit > 0 || totalCredit > 0)) {
                statusEl.textContent = 'Seimbang (Balanced)';
                statusEl.className = 'balance-status balance-ok';
                btnSubmit.disabled = false;
            } else {
                statusEl.textContent = 'Belum Seimbang';
                statusEl.className = 'balance-status balance-error';
                btnSubmit.disabled = true;
            }
        }

        // ==========================================
        // SUBMIT JOURNAL
        // ==========================================
        async function submitJournal() {
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true; 
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

            try {
                const items = [];
                let isValid = true;

                document.querySelectorAll('#jurnalBody tr').forEach(row => {
                    const select = row.querySelector('.account-select');
                    const code = select.value;
                    const name = row.querySelector('.account-name').value;
                    const debit = parseRupiah(row.querySelector('.amount-debit').value);
                    const credit = parseRupiah(row.querySelector('.amount-credit').value);
                    
                    if (!code) isValid = false;
                    if (debit > 0 || credit > 0) {
                        items.push({
                            code: code,
                            name: name || select.options[select.selectedIndex].text,
                            debit: debit,
                            credit: credit,
                            type: debit > 0 ? 'debit' : 'kredit'
                        });
                    }
                });

                if (!isValid || items.length === 0) throw new Error("Mohon lengkapi semua baris akun dan nominal!");

                const payload = {
                    action: 'addJurnalFromWeb',
                    data: {
                        tanggal: normalizeDate(document.getElementById('purDate').value),
                        noBukti: document.getElementById('noBukti').value.trim(),
                        keterangan: document.getElementById('keterangan').value.trim(),
                        inputBy: 'iin@rezekiamanahjaya.com', 
                        inputByName: 'IIN SEPATAN',
                        items: items
                    }
                };

                const res = await fetch(GAS_URL, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload) 
                });
                
                const result = await res.json();
                
                if(result.status === 'success') {
                    showNotification(`Jurnal berhasil disimpan! ID: ${result.journalId}`, "success");
                    document.getElementById('noBukti').value = '';
                    document.getElementById('keterangan').value = '';
                    document.getElementById('jurnalBody').innerHTML = '';
                    addJournalRow();
                    calcBalance();
                } else {
                    throw new Error(result.message);
                }

            } catch(err) {
                showNotification(err.message, "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Simpan Jurnal';
            }
        }

        function showNotification(message, type) {
            const notif = document.getElementById('notification');
            notif.className = `notification ${type}`;
            notif.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
