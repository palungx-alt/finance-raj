<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinanceRAJ - Approval Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.15);
            --bg-body: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-sec: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 16px;
            --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }

        /* HEADER */
        .top-bar { 
            background: var(--surface); padding: 16px 24px; position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: space-between;
        }
        .brand-area { display: flex; align-items: center; gap: 12px; }
        .btn-back { 
            background: var(--bg-body); border: none; padding: 10px; border-radius: 12px; 
            cursor: pointer; color: var(--text-main); font-weight: 600; font-size: 14px; 
            display: inline-flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .btn-back:hover { background: var(--border); }
        
        .page-title h1 { font-size: 18px; font-weight: 700; margin: 0; }
        .page-title p { font-size: 12px; color: var(--text-sec); margin-top: 2px; }
        
        .btn-new { 
            background: var(--primary); color: white; border: none; padding: 10px 20px; 
            border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px; 
            display: inline-flex; align-items: center; gap: 8px; transition: 0.2s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .btn-new:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4); }

        /* CONTAINER & FILTERS */
        .container { max-width: 1000px; margin: 24px auto; padding: 0 20px; }
        
        .filters { 
            display: flex; gap: 10px; margin-bottom: 24px; overflow-x: auto; 
            padding-bottom: 5px; scrollbar-width: none;
        }
        .filter-btn { 
            background: white; border: 1px solid var(--border); padding: 8px 16px; 
            border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--text-sec); 
            cursor: pointer; white-space: nowrap; transition: 0.2s;
        }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* TABLE CARD */
        .table-card { 
            background: var(--surface); border-radius: var(--radius); 
            box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden;
        }
        
        .search-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; }
        .search-input { 
            flex: 1; padding: 10px 16px; border: 1px solid var(--border); 
            border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s;
        }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 16px 20px; font-size: 12px; text-transform: uppercase; color: var(--text-sec); border-bottom: 1px solid var(--border); }
        td { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8fafc; }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-submitted { background: #eff6ff; color: var(--primary); }
        .badge-approved { background: #ecfdf5; color: var(--success); }
        .badge-rejected { background: #fef2f2; color: var(--danger); }

        .btn-action { 
            background: none; border: 1px solid var(--border); padding: 6px 12px; 
            border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--text-main); 
            transition: 0.2s; margin-right: 5px;
        }
        .btn-action:hover { background: var(--bg-body); border-color: var(--primary); color: var(--primary); }
        .btn-approve { background: var(--success); color: white; border: none; }
        .btn-approve:hover { background: #059669; color: white; }

        /* MODAL & SIGNATURE PAD */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        
        .modal-box { 
            background: var(--surface); width: 100%; max-width: 500px; 
            border-radius: var(--radius); padding: 24px; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { font-size: 18px; font-weight: 700; }
        .close-modal { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-sec); }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 13px; }
        .form-control { 
            width: 100%; padding: 12px; border: 1px solid var(--border); 
            border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        
        .signature-pad { 
            border: 2px dashed var(--border); border-radius: 10px; background: #f8fafc; 
            height: 150px; width: 100%; cursor: crosshair; touch-action: none;
        }

        @media (max-width: 600px) {
            .table-card { border-radius: 0; border-left: none; border-right: none; }
            .container { padding: 0; margin-top: 16px; }
            th, td { padding: 12px 16px; font-size: 13px; }
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="brand-area">
            <!-- TOMBOL KEMBALI -->
            <button onclick="window.location.href='dashboard.html'" class="btn-back"><i class="fas fa-arrow-left"></i></button>
            
            <img src="assets/logo.png" alt="Logo" style="width:32px; height:auto;" onerror="this.style.display='none'">
            <div class="page-title">
                <h1>Approval Form</h1>
                <p>Kasbon, Pembelian Aset & Operasional</p>
            </div>
        </div>
        <button class="btn-new" onclick="openModal('newFormModal')"><i class="fas fa-plus"></i> Ajukan Baru</button>
    </div>

    <div class="container">
        <div class="filters">
            <button class="filter-btn active" onclick="filterStatus('')">Semua</button>
            <button class="filter-btn" onclick="filterStatus('Submitted')">Menunggu</button>
            <button class="filter-btn" onclick="filterStatus('Approved')">Disetujui</button>
            <button class="filter-btn" onclick="filterStatus('Rejected')">Ditolak</button>
        </div>

        <div class="table-card">
            <div class="search-header">
                <input type="text" id="searchInput" class="search-input" placeholder="Cari ID, Pemohon, atau Keperluan..." onkeyup="searchTable()">
            </div>
            <div style="overflow-x:auto;">
                <table id="approvalTable">
                    <thead>
                        <tr>
                            <th>ID Form</th>
                            <th>Tanggal</th>
                            <th>Tipe</th>
                            <th>Pemohon</th>
                            <th class="hide-mobile">Jumlah</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="7" style="text-align:center; padding:30px; color:var(--text-sec);">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL: BUAT FORM BARU -->
    <div id="newFormModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2>Buat Pengajuan Baru</h2>
                <button class="close-modal" onclick="closeModal('newFormModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>Tipe Pengajuan</label>
                <select id="newType" class="form-control">
                    <option value="Kasbon">Kasbon / Uang Jalan</option>
                    <option value="Pembelian Aset">Pembelian Aset / Sparepart</option>
                    <option value="Operasional">Pengeluaran Operasional Lainnya</option>
                </select>
            </div>
            <div class="form-group">
                <label>Jumlah (Rp)</label>
                <input type="number" id="newAmount" class="form-control" placeholder="0">
            </div>
            <div class="form-group">
                <label>Keperluan / Keterangan</label>
                <textarea id="newPurpose" class="form-control" rows="3" placeholder="Jelaskan detail keperluan..."></textarea>
            </div>
            <div class="form-group">
                <label>Tanda Tangan Pemohon</label>
                <canvas id="sigCanvasNew" class="signature-pad"></canvas>
                <button onclick="clearSig('sigCanvasNew')" style="margin-top:8px; background:none; border:none; color:var(--text-sec); font-size:12px; cursor:pointer;"><i class="fas fa-eraser"></i> Hapus Tanda Tangan</button>
            </div>
            <button class="btn-new" style="width:100%; justify-content:center;" onclick="submitNewForm()">
                <i class="fas fa-paper-plane"></i> Submit Pengajuan
            </button>
        </div>
    </div>

    <!-- MODAL: APPROVE / REJECT -->
    <div id="approveModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2>Review Pengajuan</h2>
                <button class="close-modal" onclick="closeModal('approveModal')">&times;</button>
            </div>
            <div id="reviewDetails" style="background:#f8fafc; padding:16px; border-radius:10px; margin-bottom:20px; font-size:14px; line-height:1.6;"></div>
            
            <div class="form-group">
                <label>Tanda Tangan Approver</label>
                <canvas id="sigCanvasApp" class="signature-pad"></canvas>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn-action" style="flex:1; padding:12px; background:#fef2f2; color:var(--danger); border-color:#fecaca;" onclick="processApproval('Rejected')">Tolak</button>
                <button class="btn-action btn-approve" style="flex:1; padding:12px;" onclick="processApproval('Approved')">Setujui</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAc12QQPnjqlaNmIzPl2OqfTrC0HP2YCWg",
            authDomain: "finance-raj.firebaseapp.com",
            projectId: "finance-raj",
            storageBucket: "finance-raj.firebasestorage.app",
            messagingSenderId: "138468278392",
            appId: "1:138468278392:web:215731466beb7f89566d8d",
            measurementId: "G-BMG4L7P2DP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxSf-y1s_ewWXblCpu4N0NHFdSM7Y0usDaJiEdSJE-5Jv35oVGAkgAsSAifJL6VTJimXQ/exec';

        let currentFilter = '';
        let currentFormId = null;
        let currentUser = null; // Variabel global untuk menyimpan data user

        // SIGNATURE PAD LOGIC (FIXED FOR MOBILE & MODAL)
        function initSignature(canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            let isDrawing = false;

            const resize = () => {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = 150;
                ctx.strokeStyle = "#0f172a";
                ctx.lineWidth = 2;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
            };
            
            setTimeout(resize, 50);
            window.addEventListener('resize', resize);

            function getPos(e) {
                const r = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - r.left, y: clientY - r.top };
            }

            function start(e) { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
            function draw(e) { if(!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
            function stop() { isDrawing = false; }

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('touchstart', start, {passive:false});
            canvas.addEventListener('touchmove', draw, {passive:false});
            canvas.addEventListener('touchend', stop);
        }

        document.addEventListener('DOMContentLoaded', () => {
            // AMBIL DATA USER DARI LOCALSTORAGE
            currentUser = JSON.parse(localStorage.getItem('financeRajUser'));
            if (!currentUser) {
                window.location.href = 'index.html';
                return;
            }
            
            initSignature('sigCanvasNew');
            initSignature('sigCanvasApp');
            
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.target.classList.contains('open')) {
                        const modalId = mutation.target.id;
                        if(modalId === 'newFormModal') initSignature('sigCanvasNew');
                        if(modalId === 'approveModal') initSignature('sigCanvasApp');
                    }
                });
            });
            
            observer.observe(document.getElementById('newFormModal'), { attributes: true, attributeFilter: ['class'] });
            observer.observe(document.getElementById('approveModal'), { attributes: true, attributeFilter: ['class'] });

            loadForms();
        });

        window.openModal = (id) => document.getElementById(id).classList.add('open');
        window.closeModal = (id) => document.getElementById(id).classList.remove('open');
        window.clearSig = (id) => {
            const c = document.getElementById(id);
            c.getContext('2d').clearRect(0,0,c.width,c.height);
        }

        async function loadForms() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px;">Memuat...</td></tr>';
            
            try {
                const url = currentFilter ? `${GAS_URL}?action=getApprovalForms&status=${currentFilter}` : `${GAS_URL}?action=getApprovalForms`;
                const res = await fetch(url);
                const data = await res.json();
                
                if(data.status === 'success' && data.forms && data.forms.length > 0) {
                    tbody.innerHTML = data.forms.map(f => `
                        <tr>
                            <td style="font-weight:600; color:var(--primary);">${f.id}</td>
                            <td>${new Date(f.tanggal).toLocaleDateString('id-ID')}</td>
                            <td>${f.tipeForm}</td>
                            <td>${f.pemohon}</td>
                            <td class="hide-mobile" style="font-weight:700;">${formatRupiah(f.jumlah)}</td>
                            <td><span class="badge badge-${f.status.toLowerCase()}">${f.status}</span></td>
                            <td>
                                ${f.status === 'Submitted' ? `<button class="btn-action btn-approve" onclick="openApprove('${f.id}', '${escapeHtml(f.tipeForm)}', '${escapeHtml(f.pemohon)}', '${f.jumlah}', '${escapeHtml(f.keperluan)}')">Review</button>` : ''}
                                <button class="btn-action" onclick="alert('Detail: ${escapeHtml(f.keperluan)}')"><i class="fas fa-eye"></i></button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color:var(--text-sec);">Tidak ada data form</td></tr>';
                }
            } catch(e) { console.error(e); tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">Gagal memuat data</td></tr>'; }
        }

        window.filterStatus = (status) => {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            loadForms();
        }

        window.searchTable = () => {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(input) ? '' : 'none';
            });
        }

        async function submitNewForm() {
            if (!currentUser) return alert("Sesi login tidak valid. Silakan login ulang.");
            
            const type = document.getElementById('newType').value;
            const amount = document.getElementById('newAmount').value;
            const purpose = document.getElementById('newPurpose').value;
            const canvas = document.getElementById('sigCanvasNew');
            
            if(!amount || !purpose) return alert("Lengkapi semua data!");
            
            const payload = {
                action: 'addApprovalForm',
                formData: {
                    tipeForm: type, 
                    tanggal: new Date().toISOString().split('T')[0],
                    pemohon: currentUser.fullName, // Gunakan nama dari localStorage
                    jumlah: amount, 
                    keperluan: purpose,
                    signaturePemohon: canvas.toDataURL(),
                    namaPemohonTTD: currentUser.fullName,
                    tanggalTTDPemohon: new Date().toISOString()
                }
            };

            try {
                const res = await fetch(GAS_URL, { method:'POST', body:JSON.stringify(payload) });
                const result = await res.json();
                if(result.status === 'success') {
                    alert("Pengajuan berhasil dikirim!");
                    closeModal('newFormModal');
                    clearSig('sigCanvasNew');
                    document.getElementById('newAmount').value = '';
                    document.getElementById('newPurpose').value = '';
                    loadForms();
                } else { alert("Error: " + result.message); }
            } catch(e) { alert("Gagal mengirim data: " + e.message); }
        }

        window.openApprove = (id, type, pemohon, jumlah, keperluan) => {
            currentFormId = id;
            document.getElementById('reviewDetails').innerHTML = `
                <strong>ID:</strong> ${id}<br>
                <strong>Tipe:</strong> ${type}<br>
                <strong>Pemohon:</strong> ${pemohon}<br>
                <strong>Jumlah:</strong> ${formatRupiah(jumlah)}<br>
                <strong>Keperluan:</strong> ${keperluan}
            `;
            openModal('approveModal');
        }

        async function processApproval(newStatus) {
            if (!currentUser) return alert("Sesi login tidak valid.");
            
            const canvas = document.getElementById('sigCanvasApp');
            
            const payload = {
                action: newStatus === 'Approved' ? 'approveForm' : 'rejectForm',
                formId: currentFormId,
                approverName: currentUser.fullName, // Gunakan nama dari localStorage
                signature: canvas.toDataURL(),
                reason: newStatus === 'Rejected' ? prompt("Masukkan alasan penolakan:") : ""
            };

            try {
                const res = await fetch(GAS_URL, { method:'POST', body:JSON.stringify(payload) });
                const result = await res.json();
                if(result.status === 'success') {
                    alert(`Form berhasil di-${newStatus === 'Approved' ? 'setujui' : 'tolak'}!`);
                    closeModal('approveModal');
                    clearSig('sigCanvasApp');
                    loadForms();
                } else { alert("Error: " + result.message); }
            } catch(e) { alert("Gagal memproses approval: " + e.message); }
        }

        function formatRupiah(num) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num); }
        function escapeHtml(text) { return String(text).replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
    </script>
</body>
</html>
