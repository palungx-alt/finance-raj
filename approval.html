<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceRAJ - Approval</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --bg-body: #f8fafc; --surface: #ffffff; --text-main: #0f172a; --text-sec: #64748b; --border: #e2e8f0; --radius: 16px; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }
        
        .top-bar { background: var(--surface); padding: 16px 24px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .btn-back { background: var(--bg-body); border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; color: var(--text-main); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-new { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        
        .container { max-width: 1000px; margin: 24px auto; padding: 0 20px; }
        .filters { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
        .filter-btn { background: white; border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--text-sec); cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .table-card { background: var(--surface); border-radius: var(--radius); box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 16px; font-size: 12px; text-transform: uppercase; color: var(--text-sec); border-bottom: 1px solid var(--border); }
        td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-submitted { background: #eff6ff; color: var(--primary); }
        .badge-approved { background: #ecfdf5; color: var(--success); }
        .badge-rejected { background: #fef2f2; color: var(--danger); }
        
        .btn-action { background: none; border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; margin-right: 5px; transition: 0.2s; }
        .btn-action:hover { background: var(--bg-body); border-color: var(--primary); color: var(--primary); }
        
        /* MODAL & SIGNATURE */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: var(--surface); width: 100%; max-width: 500px; border-radius: var(--radius); padding: 24px; max-height: 90vh; overflow-y: auto; }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; margin-bottom: 16px; outline: none; }
        .signature-pad { border: 2px dashed var(--border); border-radius: 10px; background: #f8fafc; height: 150px; width: 100%; cursor: crosshair; touch-action: none; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="dashboard.html" class="btn-back"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <button class="btn-new" onclick="openModal('newFormModal')"><i class="fas fa-plus"></i> Ajukan Baru</button>
    </div>

    <div class="container">
        <div class="filters">
            <button class="filter-btn active" onclick="filterStatus('')">Semua</button>
            <button class="filter-btn" onclick="filterStatus('Submitted')">Menunggu</button>
            <button class="filter-btn" onclick="filterStatus('Approved')">Disetujui</button>
            <button class="filter-btn" onclick="filterStatus('Rejected')">Ditolak</button>
        </div>

        <div class="table-card">
            <table id="approvalTable">
                <thead><tr><th>ID</th><th>Tanggal</th><th>Tipe</th><th>Pemohon</th><th>Jumlah</th><th>Status</th><th>Aksi</th></tr></thead>
                <tbody id="tableBody"><tr><td colspan="7" style="text-align:center; padding:30px;">Memuat...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL BUAT BARU -->
    <div id="newFormModal" class="modal-overlay">
        <div class="modal-box">
            <h2 style="margin-bottom:20px;">Buat Pengajuan Baru</h2>
            <select id="newType" class="form-control">
                <option value="Kasbon">Kasbon / Uang Jalan</option>
                <option value="Pembelian Aset">Pembelian Aset</option>
                <option value="Operasional">Operasional Lainnya</option>
            </select>
            <input type="number" id="newAmount" class="form-control" placeholder="Jumlah (Rp)">
            <textarea id="newPurpose" class="form-control" rows="3" placeholder="Keperluan..."></textarea>
            <label style="font-size:13px; font-weight:600; display:block; margin-bottom:8px;">Tanda Tangan Pemohon</label>
            <canvas id="sigCanvasNew" class="signature-pad"></canvas>
            <button class="btn-new" style="width:100%; justify-content:center;" onclick="submitNewForm()">Submit</button>
            <button class="btn-action" style="width:100%; margin-top:10px; justify-content:center;" onclick="closeModal('newFormModal')">Batal</button>
        </div>
    </div>

    <!-- MODAL APPROVE/REJECT -->
    <div id="approveModal" class="modal-overlay">
        <div class="modal-box">
            <h2 style="margin-bottom:20px;">Review Pengajuan</h2>
            <div id="reviewDetails" style="background:#f8fafc; padding:16px; border-radius:10px; margin-bottom:20px; font-size:14px;"></div>
            <label style="font-size:13px; font-weight:600; display:block; margin-bottom:8px;">Tanda Tangan Approver</label>
            <canvas id="sigCanvasApp" class="signature-pad"></canvas>
            <div style="display:flex; gap:10px;">
                <button class="btn-action" style="flex:1; background:#fef2f2; color:var(--danger); border-color:#fecaca;" onclick="processApproval('Rejected')">Tolak</button>
                <button class="btn-action" style="flex:1; background:var(--success); color:white; border:none;" onclick="processApproval('Approved')">Setujui</button>
            </div>
            <button class="btn-action" style="width:100%; margin-top:10px; justify-content:center;" onclick="closeModal('approveModal')">Batal</button>
        </div>
    </div>

    <script type="module">
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        const firebaseConfig = { apiKey: "AIzaSyAc12QQPnjqlaNmIzPl2OqfTrC0HP2YCWg", authDomain: "finance-raj.firebaseapp.com", projectId: "finance-raj", storageBucket: "finance-raj.firebasestorage.app", messagingSenderId: "138468278392", appId: "1:138468278392:web:215731466beb7f89566d8d", measurementId: "G-BMG4L7P2DP" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxSf-y1s_ewWXblCpu4N0NHFdSM7Y0usDaJiEdSJE-5Jv35oVGAkgAsSAifJL6VTJimXQ/exec';

        let currentFilter = '';
        let currentFormId = null;

        // SIGNATURE PAD LOGIC
        function initSignature(canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let isDrawing = false;
            
            const resize = () => { canvas.width = canvas.parentElement.offsetWidth; canvas.height = 150; ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 2; };
            setTimeout(resize, 50);
            
            function getPos(e) { const r = canvas.getBoundingClientRect(); const c = e.touches ? e.touches[0] : e; return { x: c.clientX - r.left, y: c.clientY - r.top }; }
            function start(e) { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
            function draw(e) { if(!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
            function stop() { isDrawing = false; }
            
            canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('touchstart', start, {passive:false}); canvas.addEventListener('touchmove', draw, {passive:false}); canvas.addEventListener('touchend', stop);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('financeRajUser'));
            if (!user) window.location.href = 'index.html';
            
            initSignature('sigCanvasNew');
            initSignature('sigCanvasApp');
            loadForms();
        });

        window.openModal = (id) => document.getElementById(id).classList.add('open');
        window.closeModal = (id) => document.getElementById(id).classList.remove('open');

        async function loadForms() {
            const tbody = document.getElementById('tableBody');
            try {
                const url = currentFilter ? `${GAS_URL}?action=getApprovalForms&status=${currentFilter}` : `${GAS_URL}?action=getApprovalForms`;
                const res = await fetch(url);
                const data = await res.json();
                
                if(data.status === 'success' && data.forms.length > 0) {
                    tbody.innerHTML = data.forms.map(f => `
                        <tr>
                            <td style="font-weight:600; color:var(--primary);">${f.id}</td>
                            <td>${new Date(f.tanggal).toLocaleDateString('id-ID')}</td>
                            <td>${f.tipeForm}</td>
                            <td>${f.pemohon}</td>
                            <td style="font-weight:700;">${formatRupiah(f.jumlah)}</td>
                            <td><span class="badge badge-${f.status.toLowerCase()}">${f.status}</span></td>
                            <td>
                                ${f.status === 'Submitted' ? `<button class="btn-action" onclick="openApprove('${f.id}', '${escapeHtml(f.tipeForm)}', '${escapeHtml(f.pemohon)}', '${f.jumlah}', '${escapeHtml(f.keperluan)}')">Review</button>` : '-'}
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color:var(--text-sec);">Tidak ada data</td></tr>';
                }
            } catch(e) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">Error loading data</td></tr>'; }
        }

        window.filterStatus = (status) => {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            loadForms();
        }

        async function submitNewForm() {
            const user = JSON.parse(localStorage.getItem('financeRajUser'));
            const type = document.getElementById('newType').value;
            const amount = document.getElementById('newAmount').value;
            const purpose = document.getElementById('newPurpose').value;
            const canvas = document.getElementById('sigCanvasNew');
            
            if(!amount || !purpose) return alert("Lengkapi semua data!");
            
            const payload = {
                action: 'addApprovalForm',
                formData: {
                    tipeForm: type, tanggal: new Date().toISOString().split('T')[0],
                    pemohon: user.fullName, jumlah: amount, keperluan: purpose,
                    signaturePemohon: canvas.toDataURL(), namaPemohonTTD: user.fullName,
                    tanggalTTDPemohon: new Date().toISOString()
                }
            };

            try {
                const res = await fetch(GAS_URL, { method:'POST', body:JSON.stringify(payload) });
                const result = await res.json();
                if(result.status === 'success') {
                    alert("Pengajuan berhasil dikirim!");
                    closeModal('newFormModal');
                    document.getElementById('newAmount').value = '';
                    document.getElementById('newPurpose').value = '';
                    loadForms();
                } else { alert("Error: " + result.message); }
            } catch(e) { alert("Gagal mengirim: " + e.message); }
        }

        window.openApprove = (id, type, pemohon, jumlah, keperluan) => {
            currentFormId = id;
            document.getElementById('reviewDetails').innerHTML = `
                <strong>ID:</strong> ${id}<br><strong>Tipe:</strong> ${type}<br>
                <strong>Pemohon:</strong> ${pemohon}<br><strong>Jumlah:</strong> ${formatRupiah(jumlah)}<br>
                <strong>Keperluan:</strong> ${keperluan}
            `;
            openModal('approveModal');
        }

        async function processApproval(newStatus) {
            const user = JSON.parse(localStorage.getItem('financeRajUser'));
            const canvas = document.getElementById('sigCanvasApp');
            
            const payload = {
                action: newStatus === 'Approved' ? 'approveForm' : 'rejectForm',
                formId: currentFormId,
                approverName: user.fullName, 
                signature: canvas.toDataURL(),
                reason: newStatus === 'Rejected' ? prompt("Masukkan alasan penolakan:") : ""
            };

            try {
                const res = await fetch(GAS_URL, { method:'POST', body:JSON.stringify(payload) });
                const result = await res.json();
                if(result.status === 'success') {
                    alert(`Form berhasil di-${newStatus === 'Approved' ? 'setujui' : 'tolak'}!`);
                    closeModal('approveModal');
                    loadForms();
                } else { alert("Error: " + result.message); }
            } catch(e) { alert("Gagal memproses: " + e.message); }
        }

        function formatRupiah(num) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num); }
        function escapeHtml(text) { return String(text).replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
    </script>
</body>
</html>
