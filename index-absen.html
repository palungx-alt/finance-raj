<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login Karyawan - FinanceRAJ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #4f46e5; --bg-body: #f8fafc; --surface: #ffffff; --text-main: #0f172a; --text-sec: #64748b; --border: #e2e8f0; --radius: 16px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .login-card { background: var(--surface); padding: 40px 30px; border-radius: var(--radius); box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
        .logo { width: 60px; height: auto; margin-bottom: 16px; }
        h1 { color: var(--primary); font-size: 24px; font-weight: 800; margin-bottom: 8px; }
        .subtitle { color: var(--text-sec); font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 13px; color: var(--text-main); }
        
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-sec); font-size: 16px; pointer-events: none; }
        
        input { width: 100%; padding: 14px 16px 14px 44px; border: 1px solid var(--border); border-radius: 12px; font-size: 16px; outline: none; transition: 0.2s; background: var(--bg-body); box-sizing: border-box; }
        input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        button { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .error-msg { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; font-weight: 500; background: #fef2f2; padding: 10px; border-radius: 8px; border: 1px solid #fecaca; }
        .footer { margin-top: 30px; font-size: 12px; color: var(--text-sec); border-top: 1px solid var(--border); padding-top: 20px; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="assets/logo.png" alt="Logo RAJ" class="logo" onerror="this.style.display='none'">
        <h1>Absensi Karyawan</h1>
        <p class="subtitle">CV REZEKI AMANAH JAYA GROUP<br>Silakan masukkan kredensial Anda</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email / Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" required placeholder="Contoh: sopir.joko@raj.com" autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" required placeholder="Masukkan password Anda">
                </div>
            </div>
            
            <button type="submit" id="btnLogin">
                <i class="fas fa-sign-in-alt"></i> Masuk Absensi
            </button>
            
            <div class="error-msg" id="errorMsg"></div>
        </form>

        <div class="footer">
            © 2026 CV Rezeki Amanah Jaya Group | Tangerang
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxSf-y1s_ewWXblCpu4N0NHFdSM7Y0usDaJiEdSJE-5Jv35oVGAkgAsSAifJL6VTJimXQ/exec';

        // Cek jika sudah login, langsung lempar ke absensi
        document.addEventListener('DOMContentLoaded', () => {
            const storedUser = JSON.parse(localStorage.getItem('financeRajUser'));
            if (storedUser && ['Driver', 'Karyawan'].includes(storedUser.role)) {
                window.location.href = 'absensi.html';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            const btnLogin = document.getElementById('btnLogin');
            const errorMsg = document.getElementById('errorMsg');

            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
            errorMsg.style.display = 'none';

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'loginWithCredentials', 
                        email: email, 
                        password: password 
                    })
                });
                
                const result = await res.json();

                if (result.status === 'success') {
                    // Validasi Role di Frontend untuk keamanan ekstra
                    if (!['Driver', 'Karyawan'].includes(result.role)) {
                        throw new Error("Akun ini bukan akun karyawan. Silakan gunakan portal Admin.");
                    }

                    localStorage.setItem('financeRajUser', JSON.stringify(result));
                    window.location.href = 'absensi.html';
                } else {
                    throw new Error(result.message);
                }

            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
                btnLogin.disabled = false;
                btnLogin.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk Absensi';
            }
        });
    </script>
</body>
</html>
