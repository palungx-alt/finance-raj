<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinanceRAJ - Absensi Karyawan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #4f46e5; --bg-body: #f8fafc; --surface: #ffffff; --text-main: #0f172a; --text-sec: #64748b; --border: #e2e8f0; --radius: 16px; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        .card { background: var(--surface); width: 100%; max-width: 400px; padding: 30px; border-radius: var(--radius); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.1); border: 1px solid var(--border); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
        .header p { font-size: 14px; color: var(--text-sec); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .form-control { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 16px; outline: none; background: var(--bg-body); transition: 0.2s; }
        .form-control:focus { border-color: var(--primary); background: white; }
        
        /* Toggle Switch Custom */
        .toggle-wrapper { display: flex; align-items: center; justify-content: space-between; padding: 14px; background: var(--bg-body); border-radius: 12px; border: 1px solid var(--border); cursor: pointer; }
        .toggle-wrapper.active { background: #eff6ff; border-color: var(--primary); }
        .toggle-label { font-weight: 600; font-size: 15px; }
        .toggle-icon { width: 24px; height: 24px; border-radius: 50%; background: #cbd5e1; display: flex; align-items: center; justify-content: center; color: white; transition: 0.3s; }
        .toggle-wrapper.active .toggle-icon { background: var(--primary); transform: rotate(180deg); }
        
        .btn-submit { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .info-box { margin-top: 20px; padding: 16px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; text-align: center; display: none; }
        .info-box.show { display: block; animation: slideUp 0.3s ease; }
        .info-total { font-size: 24px; font-weight: 800; color: var(--success); margin-top: 8px; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .logout-link { display: block; text-align: center; margin-top: 20px; color: var(--text-sec); text-decoration: none; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <img src="assets/logo.png" alt="Logo" style="width: 50px; margin-bottom: 10px;" onerror="this.style.display='none'">
            <h1>Absensi Harian</h1>
            <p id="welcomeName">Selamat Datang, Karyawan</p>
        </div>

        <form id="attendanceForm">
            <div class="form-group">
                <label>Tanggal</label>
                <input type="date" id="attDate" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label>Nama Karyawan</label>
                <input type="text" id="attName" class="form-control" placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="form-group">
                <label>Status Kehadiran</label>
                <select id="attHadir" class="form-control">
                    <option value="Ya">Datang / Hadir</option>
                    <option value="Tidak">Tidak Hadir / Izin</option>
                </select>
            </div>

            <div class="form-group">
                <label>Jumlah Trip Hari Ini</label>
                <input type="number" id="attTrip" class="form-control" placeholder="0" min="0" inputmode="numeric">
            </div>

            <!-- Toggle Uang Makan -->
            <div class="form-group">
                <label>Uang Makan Workshop?</label>
                <div class="toggle-wrapper" id="toggleMakan" onclick="toggleMakan()">
                    <span class="toggle-label">Dapat Uang Makan (Rp 15.000)</span>
                    <div class="toggle-icon"><i class="fas fa-check"></i></div>
                </div>
                <input type="hidden" id="attMakan" value="Tidak">
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">
                <i class="fas fa-paper-plane"></i> Kirim Absensi
            </button>
        </form>

        <div class="info-box" id="resultBox">
            <div style="font-size: 13px; color: var(--text-sec);">Estimasi Gaji Hari Ini</div>
            <div class="info-total" id="resultTotal">Rp 0</div>
            <div style="font-size: 12px; margin-top: 8px; color: var(--success);"><i class="fas fa-check-circle"></i> Data berhasil disimpan!</div>
        </div>

        <a href="#" class="logout-link" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Keluar / Ganti Akun</a>
    </div>

    <script type="module">
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        const firebaseConfig = { apiKey: "AIzaSyAc12QQPnjqlaNmIzPl2OqfTrC0HP2YCWg", authDomain: "finance-raj.firebaseapp.com", projectId: "finance-raj", storageBucket: "finance-raj.firebasestorage.app", messagingSenderId: "138468278392", appId: "1:138468278392:web:215731466beb7f89566d8d", measurementId: "G-BMG4L7P2DP" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxSf-y1s_ewWXblCpu4N0NHFdSM7Y0usDaJiEdSJE-5Jv35oVGAkgAsSAifJL6VTJimXQ/exec';

        // Set tanggal hari ini default
        document.getElementById('attDate').valueAsDate = new Date();

        // Cek Auth & Role saat load
        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            const storedUser = JSON.parse(localStorage.getItem('financeRajUser'));
            if(storedUser) {
                document.getElementById('welcomeName').textContent = `Halo, ${storedUser.fullName}`;
                // Auto-fill nama jika user sudah login
                document.getElementById('attName').value = storedUser.fullName;
                document.getElementById('attName').readOnly = true; // Kunci nama agar tidak bisa diganti orang lain
            }
        });

        // Toggle Logic
        window.toggleMakan = function() {
            const wrapper = document.getElementById('toggleMakan');
            const input = document.getElementById('attMakan');
            wrapper.classList.toggle('active');
            input.value = wrapper.classList.contains('active') ? 'Ya' : 'Tidak';
        }

        // Submit Logic
        document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

            const payload = {
                action: 'submitAttendance',
                formData: {
                    tanggal: document.getElementById('attDate').value,
                    nama: document.getElementById('attName').value,
                    hadir: document.getElementById('attHadir').value,
                    trip: document.getElementById('attTrip').value || 0,
                    makan: document.getElementById('attMakan').value
                }
            };

            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                
                if(result.status === 'success') {
                    document.getElementById('resultTotal').textContent = formatRupiah(result.total);
                    document.getElementById('resultBox').classList.add('show');
                    btn.innerHTML = '<i class="fas fa-check"></i> Tersimpan';
                    
                    // Reset form setelah 3 detik (kecuali nama & tanggal)
                    setTimeout(() => {
                        document.getElementById('attTrip').value = '';
                        document.getElementById('resultBox').classList.remove('show');
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                        // Reset toggle makan
                        document.getElementById('toggleMakan').classList.remove('active');
                        document.getElementById('attMakan').value = 'Tidak';
                    }, 3000);
                } else {
                    alert(result.message);
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            } catch(err) {
                alert("Gagal koneksi ke server: " + err.message);
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        window.logout = async () => {
            localStorage.removeItem('financeRajUser');
            await signOut(auth);
            window.location.href = 'index.html';
        }

        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
        }
    </script>
</body>
</html>
